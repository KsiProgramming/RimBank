# Keeps the phase issues, stage milestones and the "RimBank roadmap" Projects board in step with
# specs/roadmap.md. Policy: docs/adr/0005-ci-and-supply-chain-policy.md, as amended by ADR 0013.
name: roadmap-board

on:
  push:
    branches: [main]
    paths: [specs/roadmap.md, scripts/sync_roadmap_board.py]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: roadmap-board
  cancel-in-progress: false

jobs:
  sync:
    name: sync
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Sync labels, milestones, issues and the project
        # The default token cannot write to a user-owned Projects board, so this one job uses a
        # fine-grained or classic token with the repo and project scopes in ROADMAP_BOARD_TOKEN (ADR 0013).
        # Without the secret the job is a no-op: run the script locally instead.
        env:
          GH_TOKEN: ${{ secrets.ROADMAP_BOARD_TOKEN }}
        run: |
          if [ -z "$GH_TOKEN" ]; then
            echo "::notice::ROADMAP_BOARD_TOKEN is not set; run 'python scripts/sync_roadmap_board.py' locally instead."
            exit 0
          fi
          python3 scripts/sync_roadmap_board.py

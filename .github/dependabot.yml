# Weekly dependency updates. Minor and patch updates are grouped; majors come as separate PRs
# (a major version of a stack technology may need an ADR, see specs/tech-stack.md).
version: 2
updates:
  - package-ecosystem: nuget
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    labels: [dependencies, type:chore]
    commit-message:
      prefix: deps
    groups:
      nuget-minor-patch:
        update-types: [minor, patch]
    ignore:
      # Microsoft.OpenApi stays on 2.x while Microsoft.AspNetCore.OpenApi requires it (ADR 0020).
      - dependency-name: "Microsoft.OpenApi*"
        update-types: [version-update:semver-major]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    labels: [dependencies, type:chore, area:ci]
    commit-message:
      prefix: ci
    groups:
      actions:
        patterns: ["*"]

  - package-ecosystem: dotnet-sdk
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    labels: [dependencies, type:chore]
    commit-message:
      prefix: deps
